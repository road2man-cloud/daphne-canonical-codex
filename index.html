<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Daphne Canon Codex</title><style>body{margin:0;background:#0a0b0f;color:#eee;font:14px system-ui}main{max-width:1200px;margin:auto;padding:24px}h1{font-family:Georgia,serif}.meta{color:#aaa}.grid{display:grid;grid-template-columns:1fr 1.2fr;gap:14px}.box{border:1px solid #30343d;border-radius:12px;background:#11141a}.list div{padding:12px;border-bottom:1px solid #262b33;cursor:pointer}.list div:hover{background:#171b22}.detail{padding:16px;position:sticky;top:10px;max-height:90vh;overflow:auto}input{width:100%;padding:13px;background:#090b0f;color:#fff;border:1px solid #353b46;border-radius:8px;margin:12px 0}table{border-collapse:collapse;width:100%;font-size:11px}td,th{padding:5px;border-bottom:1px solid #30343d;text-align:left;vertical-align:top}.badge{color:#78d6a0}pre{white-space:pre-wrap;word-break:break-word;font-size:10px}@media(max-width:850px){.grid{grid-template-columns:1fr}.detail{position:relative}}</style><main><h1>Daphne Canon Codex</h1><div class="meta" id="meta"></div><input id="q" placeholder="검색: 아머 브레이크, 몽상 아수라권, 194000330…"><div class="grid"><section class="box list" id="list"></section><aside class="box detail" id="detail">항목을 선택하세요.</aside></div></main><script>let D;fetch('data.json').then(r=>r.json()).then(x=>{D=x;meta.textContent=`CANON-A ONLY · revision ${x.master_revision} · skills ${x.census['skill/skill'].toLocaleString()} · characters ${x.census['character/character']} · enemies ${x.census['enemy/enemy'].toLocaleString()} · items ${x.census['item/item'].toLocaleString()} · equipment ${x.census['equip/equipment'].toLocaleString()}`;render()});q.oninput=render;function render(){if(!D)return;let s=q.value.toLowerCase();let a=D.records.filter(r=>JSON.stringify(r).toLowerCase().includes(s));list.innerHTML=a.map((r,i)=>`<div data-i="${D.records.indexOf(r)}"><b>${r.name}</b><br><span class="badge">CANON-A</span> · ID ${r.identification}</div>`).join('');list.querySelectorAll('div').forEach(e=>e.onclick=()=>show(D.records[+e.dataset.i]))}function show(r){let ks=[...new Set(r.levels.flatMap(x=>Object.keys(x).filter(k=>k!='effects')))];let t=`<table><tr>${ks.map(k=>`<th>${k}</th>`).join('')}</tr>${r.levels.map(x=>`<tr>${ks.map(k=>`<td>${x[k]??''}</td>`).join('')}</tr>`).join('')}</table>`;detail.innerHTML=`<h2>${r.name}</h2><div>ID ${r.identification}</div><p>${(r.description||'').replaceAll('
','<br>')}</p>${t}<h3>Raw canonical record</h3><pre>${JSON.stringify(r,null,2)}</pre>`}</script>
