function dreamTable(r,vals,P,def=0){if(![194000330,194000331].includes(+r.identification))return '';let rows=vals.map(v=>{let d=v.ds[0],z=finalDamage(P,d,true,def),sp=Number(v.cost)||0;if(!z)return '';let e6=sp>0?z.base*6/sp:null,e8=sp>0?z.base*8/sp:null;return `<tr><td>${v.x.level}</td><td><b>${z.min*6}~${z.max*6}</b></td><td><b>${z.min*8}~${z.max*8}</b></td><td><b>${e6==null?'-':e6.toFixed(2)}</b></td><td><b>${e8==null?'-':e8.toFixed(2)}</b></td></tr>`}).join('');return `<h3>몽상 아수라권 타수별 총합</h3><div class="muted">세스타스는 part=2라 양손 분기 고정, attack_correction=100이라 강완 보정은 없습니다.</div><table><tr><th>Lv</th><th>6타 최종범위</th><th>8타 최종범위</th><th>6타/SP</th><th>8타/SP</th></tr>${rows}</table>`}
function tenchaTable(r,vals,P,def=0){if(![194000110,194000111].includes(+r.identification))return '';let rows=vals.map(v=>{let d=v.ds[0],zn=finalDamage(P,d,false,def),zb=finalDamage(P,d,true,def),sp=Number(v.cost)||0;if(!zn||!zb)return '';let f=(z,h)=>`${z.min*h}~${z.max*h}`,e=(z,h)=>sp>0?(z.base*h/sp).toFixed(2):'-';return `<tr><td>${v.x.level}</td><td><b>${f(zb,2)}</b></td><td><b>${f(zn,4)}</b></td><td><b>${f(zn,6)}</b></td><td>${e(zb,2)}</td><td><b>${e(zn,4)}</b></td><td><b>${e(zn,6)}</b></td></tr>`}).join('');return `<h3>천자만홍 무기별 총합</h3><div class="muted">damage_count=99는 장착 무기의 AttackCount를 읽고, 천자만홍은 이를 ×2합니다. 활 기본 1타→2타, 일반 투척 닌자 도구 기본 2타→4타, 유자 비녀 기본 3타→6타. 이도류 운용값은 한손 비교축이 아니라 양손/이도류 실전 비교축에서 봅니다.</div><table><tr><th>Lv</th><th>활 2타</th><th>이도류 4타</th><th>유자 비녀 6타</th><th>활/SP</th><th>4타/SP</th><th>6타/SP</th></tr>${rows}</table>`}
function show(r){if(!r){detail.innerHTML='<div class="warn">레코드를 찾지 못했습니다.</div>';return}let vals=(r.levels||[]).map(x=>({x,...walkVals(x)})),caps=vals.flatMap(v=>[v.ds[0]?.valid_cap_parameter_value||0,v.ds[0]?.valid_cap_parameter_value_both_hands||0]),maxCap=Math.max(0,...caps),defP=maxCap?Math.ceil(maxCap*1.25/10)*10:500,linked=vals.find(v=>v.linked)?.linked,costLabel=vals.some(v=>v.skill_kind===4)?'MP':'SP',dreamOnly=[194000330,194000331].includes(+r.identification),tencha=[194000110,194000111].includes(+r.identification);let inherit=(r.inheritance_points||[]).length?`<h3>계승 필요 포인트</h3><table><tr><th>Lv</th><th>포인트</th></tr>${r.inheritance_points.map(x=>`<tr><td>${esc(x.level)}</td><td>${esc(x.need_point)}</td></tr>`).join('')}</table>`:'';let modeCtl=(dreamOnly||tencha)?'':`<label class="muted">장비 장착 상태</label><select id="equipMode"><option value="both">양손 장착</option><option value="normal">한손 장착</option></select>`;detail.innerHTML=`<h2>${esc(r.name)}</h2><div class="muted">ID ${esc(r.identification)}</div>${badges(r.evidence)}<p>${esc(r.description||'').split('\n').join('<br>')}</p><p class="muted">${esc(r.detail_description||'').split('\n').join('<br>')}</p>${linked?`<div class="card"><b>호출 스킬: ${esc(linked.target_name)} Lv${esc(linked.target_level)}</b><br><span class="muted">이 비술 자체에는 직접 피해식이 없어서, 아래 표는 실제로 호출되는 스킬의 수치입니다.</span></div>`:''}<h3>레벨별 핵심 수치</h3>${maxCap?`<label class="muted">장비 장착 후 최종 참조 파라미터</label><input id="refP" inputmode="numeric" type="number" min="1" value="${defP}">${modeCtl}<label class="muted">적 방어/마방 (방깎 전 수치)</label><input id="enemyDef" inputmode="numeric" type="number" min="0" value="0"><div class="muted">강완은 공격력 조립 단계에서 이미 반영됩니다. 은 양손도끼(202001300)·라그나로크(200101210)는 attack_correction=210(×2.10)이지만 장착 후 공격력을 입력할 때 다시 ×2.10 하지 않습니다. 실제 장비 상태에 따라 일반/양손 계수와 감쇠점을 선택합니다. 적 방어/마방은 네이티브 CalcDamage처럼 50%만 차감하고, 같은 스킬의 방깎은 선반영하지 않습니다. 표시는 기본 변동폭 0.96~1.05 범위입니다.</div>`:''}<table><tr><th>Lv</th><th>${costLabel}</th><th>위력 일반/양손</th><th>고정</th><th>명중</th><th>감쇠점 일반/양손</th><th>장착</th><th>${tencha?'1타 기준':'최종데미지'}</th><th>피해/${costLabel}</th><th>추가 효과</th></tr><tbody id="coreBody"></tbody></table><div id="dreamBox"></div><div id="tenchaBox"></div>${inherit}`;function recalc(){let pv=Math.max(0,Number(document.getElementById('refP')?.value)||0),dv=Math.max(0,Number(document.getElementById('enemyDef')?.value)||0),mode=dreamOnly?'both':tencha?'normal':(document.getElementById('equipMode')?.value||'both');document.getElementById('coreBody').innerHTML=coreRows(vals,pv,dreamOnly,dv,mode);let db=document.getElementById('dreamBox');if(db)db.innerHTML=dreamTable(r,vals,pv,dv);let tb=document.getElementById('tenchaBox');if(tb)tb.innerHTML=tenchaTable(r,vals,pv,dv)};['refP','enemyDef','equipMode'].forEach(id=>document.getElementById(id)?.addEventListener('input',recalc));recalc()}
meta.textContent=`CURRENT MASTER ${INDEX.master_revision.slice(0,12)}… · ${INDEX.family_count.toLocaleString()} skill families · 검색 인덱스 내장 / 상세 shard 로드`;q.addEventListener('input',render);render();const U=new URLSearchParams(location.search),did=Number(U.get('id')),dsh=Number(U.get('shard'));if(did&&Number.isFinite(dsh))loadDetail(did,dsh);
