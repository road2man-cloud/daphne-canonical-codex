const qEl=document.getElementById('q'),metaEl=document.getElementById('meta'),statusEl=document.getElementById('status'),listEl=document.getElementById('list'),detailEl=document.getElementById('detail');
function esc(v){return String(v??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function render(){const s=qEl.value.trim().toLowerCase();const a=D.records.filter(r=>!s||JSON.stringify(r).toLowerCase().includes(s));statusEl.textContent=`${a.length} / ${D.records.length}개 canonical 레코드`;listEl.innerHTML=a.length?a.map(r=>`<div class="row" data-id="${esc(r.identification)}"><b>${esc(r.name)}</b><br><span class="badge">CANON-A</span> · ID ${esc(r.identification)}</div>`).join(''):'<div class="empty">검색 결과가 없습니다.</div>';listEl.querySelectorAll('.row').forEach(e=>e.addEventListener('click',()=>show(D.records.find(r=>String(r.identification)===e.dataset.id))))}
function show(r){if(!r)return;const levels=Array.isArray(r.levels)?r.levels:[];const ks=[...new Set(levels.flatMap(x=>Object.keys(x).filter(k=>k!=='effects')))];const t=levels.length?`<table><tr>${ks.map(k=>`<th>${esc(k)}</th>`).join('')}</tr>${levels.map(x=>`<tr>${ks.map(k=>`<td>${esc(x[k])}</td>`).join('')}</tr>`).join('')}</table>`:'';detailEl.innerHTML=`<h2>${esc(r.name)}</h2><div>ID ${esc(r.identification)}</div><p>${esc(r.description||'').replace(/
/g,'<br>')}</p>${t}<h3>Raw canonical record</h3><pre>${esc(JSON.stringify(r,null,2))}</pre>`}
