<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>동급 장비 비교</title><style>body{margin:0;background:#090a0d;color:#eee;font:15px system-ui}main{max-width:1180px;margin:auto;padding:22px 16px}a{color:#8fd3ff}h1{font:700 34px Georgia,serif}.muted{color:#aeb3bd}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.card{border:1px solid #333b48;border-radius:14px;padding:14px;background:#101218}label{display:block;color:#aeb3bd;margin-top:9px}input,select{box-sizing:border-box;width:100%;padding:10px;background:#090b0f;color:#fff;border:1px solid #48505d;border-radius:9px;font-size:15px}.big{font-size:28px;font-weight:800}table{border-collapse:collapse;width:100%;display:block;overflow:auto;margin-top:14px}td,th{padding:8px;border-bottom:1px solid #30343d;white-space:nowrap;text-align:left}.hi{font-weight:800;color:#ffd27a}.controls{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px}@media(max-width:760px){.grid,.controls{grid-template-columns:1fr 1fr}h1{font-size:29px}}</style></head><body><main><nav><a href="ranking.html">← 기존 스킬 랭킹</a> · <a href="index.html">스킬 검색</a></nav><h1>동급 장비 실전 비교 β</h1><p class="muted">같은 표시공격을 강제로 맞추지 않고, current master의 실제 무기 기본공·강화 성장·attack_correction으로 장착 후 표시공격을 먼저 재구성합니다. 품질·부가호·전변·정련은 아직 의미를 억지로 환산하지 않고, 해당 과정을 마친 장비에서 게임 UI에 보이는 최종 공격 가산값을 양쪽에 같은 투자 수준으로 입력합니다. 적 방어는 방깎 전 수치입니다.</p><div class="controls"><div><label>강화 +N (양쪽 공통)</label><input id="rein" type="number" min="0" max="20" value="20"></div><div><label>비무기 base 공격 (대검)</label><input id="bg" type="number" min="0" value="200"></div><div><label>비무기 base 공격 (세스터스)</label><input id="bc" type="number" min="0" value="200"></div><div><label>적 방어</label><input id="def" type="number" min="0" value="0"></div></div><div class="controls"><div><label>장비 공격 가산 합계</label><input id="flat" type="number" value="0"></div><div><label>장비 품질/부가호 기준</label><input value="동급 투자 · UI 최종값 입력" disabled></div><div><label>몽상 타수</label><select id="hits"><option value="6">6타</option><option value="8">8타</option></select></div><div><label>스킬 Lv</label><input id="lv" type="number" min="1" max="7" value="1"></div></div><div class="grid" id="cards"></div><table><thead><tr><th>세팅</th><th>스킬</th><th>SP</th><th>표시공격</th><th>감쇠점</th><th>최종데미지</th><th>피해/SP</th></tr></thead><tbody id="tb"></tbody></table><script>const D={"skills":[{"id":110000050,"name":"땅 가르기 일격","lv":1,"sp":7,"rate":200,"rate_both":240,"fixed":0,"cap":200,"cap_both":600,"start":0,"damage_type":1,"damage_count":1,"mult":1,"shard":18},{"id":110000050,"name":"땅 가르기 일격","lv":2,"sp":11,"rate":215,"rate_both":258,"fixed":0,"cap":240,"cap_both":720,"start":0,"damage_type":1,"damage_count":1,"mult":1,"shard":18},{"id":110000050,"name":"땅 가르기 일격","lv":3,"sp":17,"rate":240,"rate_both":288,"fixed":0,"cap":400,"cap_both":1200,"start":40,"damage_type":1,"damage_count":1,"mult":1,"shard":18},{"id":110000050,"name":"땅 가르기 일격","lv":4,"sp":21,"rate":255,"rate_both":306,"fixed":0,"cap":500,"cap_both":1500,"start":40,"damage_type":1,"damage_count":1,"mult":1,"shard":18},{"id":110000050,"name":"땅 가르기 일격","lv":5,"sp":32,"rate":275,"rate_both":330,"fixed":0,"cap":800,"cap_both":2400,"start":80,"damage_type":1,"damage_count":1,"mult":1,"shard":18},{"id":110000050,"name":"땅 가르기 일격","lv":6,"sp":39,"rate":290,"rate_both":348,"fixed":0,"cap":1000,"cap_both":3000,"start":80,"damage_type":1,"damage_count":1,"mult":1,"shard":18},{"id":110000050,"name":"땅 가르기 일격","lv":7,"sp":56,"rate":315,"rate_both":378,"fixed":0,"cap":1300,"cap_both":3900,"start":200,"damage_type":1,"damage_count":1,"mult":1,"shard":18},{"id":194000330,"name":"몽상 아수라권","lv":1,"sp":14,"rate":165,"rate_both":198,"fixed":25,"cap":80,"cap_both":240,"start":0,"damage_type":1,"damage_count":99,"mult":2,"shard":10},{"id":194000330,"name":"몽상 아수라권","lv":2,"sp":19,"rate":180,"rate_both":216,"fixed":40,"cap":96,"cap_both":288,"start":0,"damage_type":1,"damage_count":99,"mult":2,"shard":10},{"id":194000330,"name":"몽상 아수라권","lv":3,"sp":26,"rate":200,"rate_both":240,"fixed":65,"cap":160,"cap_both":480,"start":40,"damage_type":1,"damage_count":99,"mult":2,"shard":10},{"id":194000330,"name":"몽상 아수라권","lv":4,"sp":35,"rate":215,"rate_both":258,"fixed":80,"cap":200,"cap_both":600,"start":40,"damage_type":1,"damage_count":99,"mult":2,"shard":10},{"id":194000330,"name":"몽상 아수라권","lv":5,"sp":50,"rate":235,"rate_both":282,"fixed":105,"cap":320,"cap_both":960,"start":80,"damage_type":1,"damage_count":99,"mult":2,"shard":10},{"id":194000330,"name":"몽상 아수라권","lv":6,"sp":66,"rate":250,"rate_both":300,"fixed":120,"cap":400,"cap_both":1200,"start":80,"damage_type":1,"damage_count":99,"mult":2,"shard":10},{"id":194000330,"name":"몽상 아수라권","lv":7,"sp":94,"rate":270,"rate_both":324,"fixed":140,"cap":640,"cap_both":1920,"start":200,"damage_type":1,"damage_count":99,"mult":2,"shard":10},{"id":194000331,"name":"몽상 아수라권","lv":1,"sp":14,"rate":165,"rate_both":198,"fixed":25,"cap":80,"cap_both":240,"start":0,"damage_type":1,"damage_count":99,"mult":1,"shard":11},{"id":194000331,"name":"몽상 아수라권","lv":2,"sp":19,"rate":180,"rate_both":216,"fixed":40,"cap":96,"cap_both":288,"start":0,"damage_type":1,"damage_count":99,"mult":1,"shard":11},{"id":194000331,"name":"몽상 아수라권","lv":3,"sp":26,"rate":200,"rate_both":240,"fixed":65,"cap":160,"cap_both":480,"start":40,"damage_type":1,"damage_count":99,"mult":1,"shard":11},{"id":194000331,"name":"몽상 아수라권","lv":4,"sp":35,"rate":215,"rate_both":258,"fixed":80,"cap":200,"cap_both":600,"start":40,"damage_type":1,"damage_count":99,"mult":1,"shard":11},{"id":194000331,"name":"몽상 아수라권","lv":5,"sp":50,"rate":235,"rate_both":282,"fixed":105,"cap":320,"cap_both":960,"start":80,"damage_type":1,"damage_count":99,"mult":1,"shard":11},{"id":194000331,"name":"몽상 아수라권","lv":6,"sp":66,"rate":250,"rate_both":300,"fixed":120,"cap":400,"cap_both":1200,"start":80,"damage_type":1,"damage_count":99,"mult":1,"shard":11},{"id":194000331,"name":"몽상 아수라권","lv":7,"sp":94,"rate":270,"rate_both":324,"fixed":140,"cap":640,"cap_both":1920,"start":200,"damage_type":1,"damage_count":99,"mult":1,"shard":11}],"weapons":{"greatsword":{"name":"은 대검","id":200001200,"base":132,"corr":2.1,"reinforce":[0,8,14,21,26,33,38,44,49,55,59,64,69,74,77,82,85,90,93,97,99]},"caestus":{"name":"은 세스터스","id":207000500,"base":40,"corr":1.0,"reinforce":[0,2,4,7,9,12,14,16,19,21,25,27,29,32,34,37,39,41,44,46,49]}}};function weaponAttack(w,n){return w.base+(w.reinforce[Math.max(0,Math.min(20,n))]||0)}function assembled(w,base,flat,n){let equip=weaponAttack(w,n);return Math.ceil(base*w.corr)+Math.ceil(equip+flat)}function skill(id,lv){return D.skills.find(x=>+x.id===id&&+x.lv===lv)}function dmg(P,r,both,def,hits=1){let rate=+(both?r.rate_both:r.rate)||0,cap=+(both?r.cap_both:r.cap)||0,start=+r.start||0,R=P,x;if(start>0&&R<start)x=R*rate/100*.75;else if(cap<=0||R<=cap)x=R*rate/100;else x=(cap+(R-cap)*.5)*rate/100;x+=(+r.fixed||0);x=Math.max(1,x-def*.5);let mid=x*hits;return {min:Math.ceil(x*.96*hits-.001),max:Math.ceil(x*1.05*hits-.001),mid}}function go(){let n=Math.max(0,Math.min(20,+rein.value||0)),bgv=Math.max(0,+bg.value||0),bcv=Math.max(0,+bc.value||0),fv=+flat.value||0,dv=Math.max(0,+def.value||0),L=Math.max(1,Math.min(7,+lv.value||1)),H=+hits.value||6,g=D.weapons.greatsword,c=D.weapons.caestus,ag=assembled(g,bgv,fv,n),ac=assembled(c,bcv,fv,n);cards.innerHTML=`<div class="card"><b>${g.name} +${n}</b><div class="big">공격 ${ag}</div><div class="muted">무기공 ${weaponAttack(g,n)} · 비무기 base ${bgv} × ${g.corr.toFixed(2)} · 장비공 가산 ${fv}</div></div><div class="card"><b>${c.name} +${n}</b><div class="big">공격 ${ac}</div><div class="muted">무기공 ${weaponAttack(c,n)} · 비무기 base ${bcv} × ${c.corr.toFixed(2)} · 장비공 가산 ${fv}</div></div>`;let rg=skill(110000050,L),rc=skill(194000330,L)||skill(194000331,L),dg=dmg(ag,rg,true,dv,1),dc=dmg(ac,rc,true,dv,H);let e1=dg.mid/rg.sp,e2=dc.mid/rc.sp;tb.innerHTML=`<tr><td>${g.name}</td><td>땅 가르기</td><td>${rg.sp}</td><td>${ag}</td><td>${rg.cap_both}</td><td class="hi">${dg.min}~${dg.max}</td><td>${e1.toFixed(2)}</td></tr><tr><td>${c.name}</td><td>몽상 아수라권 ${H}타</td><td>${rc.sp}</td><td>${ac}</td><td>${rc.cap_both}</td><td class="hi">${dc.min}~${dc.max}</td><td>${e2.toFixed(2)}</td></tr>`}document.querySelectorAll('input,select').forEach(x=>x.addEventListener('input',go));go();</script></main></body></html>
